title: Встреча с юристом Абонент Консалт
date: 20.03.2026
context: >
  Инициативная группа посёлка Шелково собрала вопросы жителей о товариществе собственников недвижимости
  ([ТСН](/kb/tsn/)) и организовала открытую онлайн-встречу с Антоном Иващенко, юристом компании [«Абонент Консалт»](https://abonentconsult.ru).
  Жители спрашивали, как создать ТСН и что оно сможет сделать, если дороги и сети посёлка находятся в частной собственности.
