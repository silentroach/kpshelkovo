sources:
  - title: Уведомление ООО «ПЖК Николино» о плате с 1 января 2026 года — копия в чате Greenwood
    url: https://t.me/MainChatGreenwood/36680/126639
    type: community
    date_checked: 2026-09-15
    comment: На фотографии уведомления от 28 ноября 2025 года указана плата 51 500 руб. в месяц с одного домовладения с 1 января 2026 года, включая НДС 5%. Назначение платежа — содержание коттеджного поселка «Николино» и оказываемые услуги. Компания объясняет повышение ростом расходов, стоимости работ и налоговой нагрузки. Документ опубликован участником чата 15 сентября 2026 года.
  - title: Николино — официальный сайт
    url: https://nikolino.ru/
    type: official
    date_checked: 2026-09-15
    comment: На сайте указаны площадь 170 га, участки от 15 соток, расположение на 23-м километре Рублево-Успенского шоссе и компания «Мирум». Четверть территории занимают зоны отдыха. Описаны парк с озером, пляж, детские площадки, теннисные корты, зимняя лыжная трасса, языковой клуб English Lab для детей и взрослых, рестораны «Честер-Ферри» и «О’Шалей», фитнес- и СПА-клуб Riviera с бассейном, летний подогреваемый бассейн, АЗС и автомойка. Наличие этих объектов не подтверждает, что их посещение входит в поселковый платеж; теннисные корты бронируют индивидуально.
  - title: Николино — информация для жителей
    url: https://nikolino.ru/citizens/
    type: official
    date_checked: 2026-09-15
    comment: Опубликованы контакты диспетчерской и охраны, документы о пропускном режиме, договоры и отчетность прошлых лет, отдельные тарифные документы на водоснабжение и водоотведение. Адрес — Одинцовский район, 2-е Успенское шоссе, 3-й километр, Таганьково-7. Архивные документы не подтверждают включение воды в платеж 2026 года.
  - title: Николино — официальный интерактивный генплан
    url: https://nikolino.ru/#lots
    type: official
    date_checked: 2026-09-15
    comment: >-
      По всему генплану посчитан 451 отдельный земельный контур. Из 458 элементов исключены
      повторно нарисованный контур № 803 и шесть обозначений зданий № 502–507 внутри общего
      земельного контура. Объединенные контуры № 502–507 и № 352–353 учтены по одному;
      № 227 распознан по идентификатору элемента, хотя в данных подсказки ошибочно указан № 277.
      Это оценка числа участков по схеме, а не кадастровый подсчет домовладений.
      Для масштаба использованы 54 лота с ненулевой площадью в подсказках: 52 забронированных
      и 2 лота вторичной продажи. Медиана отношений площади в м² к площади контура — 0,822076.
      Сумма геометрических площадей всех 451 контура после пересчета — около 166,4 га;
      средняя — 36,9 сотки, округлено до 37. Это оценка по рисунку, не кадастровое измерение.
      У 48 из 54 калибровочных лотов расхождение с указанной площадью не превышает 10%.
      При едином масштабе участок № 905 с указанными 10 000 м² дает расхождение около 81%;
      медиана ограничивает влияние такого выброса. Пять дополнительных проверок дали расхождения 4–23%.
      Полученные 166,4 га земельных контуров не согласуются с описанием 170 га общей территории,
      четверть которой отведена под отдых. Границы площади из описания и генплана не сверены.
      На генплане также отмечены 15 парковок, 7 детских площадок, 5 парков и отдельный парк фигур,
      теннисный корт, волейбол, стритбол, хоккей, летний бассейн, фитнес- и СПА-клуб,
      банный комплекс, АЗС и два ресторана. Числа относятся к отметкам на карте.
