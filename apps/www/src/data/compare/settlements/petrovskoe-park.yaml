    date_checked: 2026-08-17
    comment: >-
      Подтверждены центральные газ, водопровод и канализация, подземная
      электросеть, охрана, кафе, детская и спортивная площадки, прогулочный
      бульвар, зона отдыха у реки и управление через ТСН. В первой очереди
      строительство завершено, во второй асфальтированы бульвар и центральные
      улицы, а остальные дороги имеют твердое покрытие.
