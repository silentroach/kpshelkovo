    url: https://www.asterra.ru/projects/losinoostrovskie-usadby/
    type: official
    date_checked: 2026-09-17
    comment: >-
      На сайте застройщика указаны 192 участка, площадь 36 га и расположение
      у деревни Супонево в Щёлковском районе; опубликованы координаты
      55.87926870, 37.95374931. Описаны центральные газ, вода и канализация,
      освещение, ограждение, КПП, круглосуточная охрана с видеонаблюдением,
      детская и спортивная площадки. Упоминание летнего бассейна расходится
      со сведениями жительницы; в карточке использованы её данные.
