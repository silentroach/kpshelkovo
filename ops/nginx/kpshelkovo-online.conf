map $http_accept $serve_markdown {
    default 0;
    "~*(^|,)\s*text/markdown(?:[;,]|$)" 1;
}

server {
    server_name kpshelkovo.online;

    root /var/www/kpshelkovo-online;
    index index.html;
    set $html_cache_control public,max-age=60,stale-while-revalidate=300;
    set $security_hsts "max-age=31536000";
    set $security_content_type nosniff;
    set $security_frame_options SAMEORIGIN;
    set $security_referrer_policy strict-origin-when-cross-origin;
    set $security_coop same-origin;
    set $security_csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://mc.yandex.ru https://mc.yandex.com https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net; script-src-attr 'none'; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com wss://mc.yandex.ru wss://mc.yandex.com https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://*.maps.yandex.net https://*.maps.yandex.ru https://*.yandex.ru; img-src 'self' data: blob: https://media.kpshelkovo.online https://mc.yandex.ru https://mc.yandex.com https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://*.maps.yandex.net https://*.yandex.ru https://yastatic.net; media-src 'self' https://media.kpshelkovo.online; style-src 'self' 'unsafe-inline' https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net; font-src 'self' data: https://yastatic.net; frame-src 'self' https://yandex.ru; worker-src 'self' blob: data: https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net; manifest-src 'self'";

    error_page 404 /404.html;
    error_page 418 = @markdown;
    recursive_error_pages on;

    server_tokens off;
    add_header Strict-Transport-Security $security_hsts always;
    add_header X-Content-Type-Options $security_content_type always;
    add_header X-Frame-Options $security_frame_options always;
    add_header Referrer-Policy $security_referrer_policy always;
    add_header Cross-Origin-Opener-Policy $security_coop always;
    add_header Content-Security-Policy $security_csp always;

    etag on;
    if_modified_since exact;
    open_file_cache max=20000 inactive=120s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip_static on;
    brotli_static on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/markdown
        text/calendar
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    brotli on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types
        text/plain
        text/markdown
        text/calendar
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    location /.well-known/acme-challenge/ {
        allow all;
        try_files $uri =404;
    }

    # Keep standardized discovery paths public, but never serve other hidden files.
    if ($uri ~ "(^|/)\.(?!well-known(?:/|$))") {
        return 404;
    }

    location ^~ /static/ {
        access_log off;
        log_not_found off;
        add_header Strict-Transport-Security $security_hsts always;
        add_header X-Content-Type-Options $security_content_type always;
        add_header X-Frame-Options $security_frame_options always;
        add_header Referrer-Policy $security_referrer_policy always;
        add_header Cross-Origin-Opener-Policy $security_coop always;
        add_header Content-Security-Policy $security_csp always;
        add_header Cache-Control public,max-age=2592000,immutable always;
        try_files $uri =404;
    }

    location ^~ /815/compare/data/ {
        access_log off;
        log_not_found off;
        add_header Strict-Transport-Security $security_hsts always;
        add_header X-Content-Type-Options $security_content_type always;
        add_header X-Frame-Options $security_frame_options always;
        add_header Referrer-Policy $security_referrer_policy always;
        add_header Cross-Origin-Opener-Policy $security_coop always;
        add_header Content-Security-Policy $security_csp always;
        add_header Cache-Control public,max-age=300,stale-while-revalidate=300 always;
        try_files $uri =404;
    }

    location ~* ^/(?:815/compare/)?(?:android-chrome-(?:192x192|512x512)\.png|apple-touch-icon\.png|favicon(?:-[0-9]+x[0-9]+)?\.(?:ico|png|svg)|icon-(?:192|512)\.svg|mstile-150x150\.png|safari-pinned-tab\.svg)$ {
