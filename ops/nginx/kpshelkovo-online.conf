        log_not_found off;
        add_header Strict-Transport-Security $security_hsts always;
        add_header X-Content-Type-Options $security_content_type always;
        add_header X-Frame-Options $security_frame_options always;
        add_header Referrer-Policy $security_referrer_policy always;
        add_header Cross-Origin-Opener-Policy $security_coop always;
        add_header Content-Security-Policy $security_csp always;
        add_header Cache-Control "public,max-age=3600,stale-while-revalidate=3600" always;
        try_files $uri =404;
    }

    location = / {
        set $md /index.md;
        add_header Strict-Transport-Security $security_hsts always;
        add_header X-Content-Type-Options $security_content_type always;
        add_header X-Frame-Options $security_frame_options always;
        add_header Referrer-Policy $security_referrer_policy always;
        add_header Cross-Origin-Opener-Policy $security_coop always;
        add_header Content-Security-Policy $security_csp always;
        add_header Cache-Control $html_cache_control always;
        add_header Vary Accept always;
        add_header Link "</.well-known/api-catalog>; rel=\"api-catalog\"" always;
        add_header Link "</llms.txt>; rel=\"describedby\"; type=\"text/plain\"" always;
        add_header Link "</llms-full.txt>; rel=\"describedby\"; type=\"text/plain\"" always;
        add_header Link "</index.md>; rel=\"alternate\"; type=\"text/markdown\"" always;

        if ($serve_markdown) {
            return 418;
        }

        try_files /index.html =404;
