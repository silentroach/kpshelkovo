# Общие заголовки HTTPS-ответов kpshelkovo.online.
# include читается при загрузке конфигурации; set на каждом запросе не нужен.
# Подключать в server и в каждом location со своим add_header: иначе заголовки
# родительского уровня не наследуются. always сохраняет их и на ответах с ошибками.

# Запоминает HTTPS для этого хоста на год, без includeSubDomains и preload.
add_header Strict-Transport-Security "max-age=31536000" always;

# Запрещает браузеру угадывать MIME-тип вместо присланного Content-Type.
add_header X-Content-Type-Options nosniff always;

# Защита от встраивания чужим сайтом для браузеров без CSP frame-ancestors.
# В современных браузерах frame-ancestors ниже имеет приоритет и разрешает Метрику.
add_header X-Frame-Options SAMEORIGIN always;

# Внешним HTTPS-сайтам передается только origin в Referer; при переходе на HTTP — ничего.
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Разрывает связь window.opener с окнами другого origin.
add_header Cross-Origin-Opener-Policy same-origin always;

# Ограничивает источники ресурсов, отправку форм и встраивание страницы.
# Исключения для Astro, Яндекс Карт, Метрики и Pagefind объяснены в CSP.md.
# Значение держим одной строкой, чтобы в HTTP-заголовок не попали переводы строк.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self' https://metrika.yandex.ru; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://mc.yandex.ru https://mc.yandex.com https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net; script-src-attr 'none'; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com wss://mc.yandex.ru wss://mc.yandex.com https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://*.maps.yandex.net https://*.maps.yandex.ru https://*.yandex.ru; img-src 'self' data: blob: https://media.kpshelkovo.online https://mc.yandex.ru https://mc.yandex.com https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://*.maps.yandex.net https://*.yandex.ru https://yastatic.net; media-src 'self' https://media.kpshelkovo.online; style-src 'self' 'unsafe-inline' https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net; font-src 'self' data: https://yastatic.net; frame-src 'self' https://mc.yandex.ru https://mc.yandex.com; worker-src 'self' blob: data: https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net; manifest-src 'self'" always;
