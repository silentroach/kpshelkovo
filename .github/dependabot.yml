version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      production:
        dependency-type: production
        patterns:
          - '*'
      development:
        dependency-type: development
        patterns:
          - '*'
        exclude-patterns:
          - '@fission-ai/openspec'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - '*'
