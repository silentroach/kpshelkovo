name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Rebuild date-derived status pages at midnight in Moscow (UTC+3).
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Turbo cache
        id: restore-turbo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-test-v2-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-v2-${{ github.head_ref || github.ref_name }}-
            ${{ runner.os }}-turbo-test-v2-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run affected typecheck
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm exec turbo run typecheck --affected

      - name: Run typecheck
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm typecheck

      - name: Run affected tests
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm exec turbo run test --affected

      - name: Run tests
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm test

      - name: Save Turbo cache
        if: ${{ steps.restore-turbo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.restore-turbo-cache.outputs.cache-primary-key }}

  deploy:
    needs: test
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: 'https://kpshelkovo.online'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'deploy' }}
      DEPLOY_WWW_PATH: ${{ secrets.DEPLOY_WWW_PATH }}
      DEPLOY_MEDIA_PATH: /var/www/media-kpshelkovo-online
      INDEXNOW_PENDING_PATH: .cache/kpshelkovo/indexnow-rsync-changes.txt
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          PUBLIC_YANDEX_MAPS_API_KEY: ${{ secrets.YANDEX_MAPS_API_KEY }}
        run: pnpm build

      - name: Prepare IndexNow ownership file
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/indexnow.ts prepare dist/www

      - name: Validate deploy settings
        run: |
          host="$(printf '%s' "$DEPLOY_HOST" | tr -d '\r\n' | xargs)"
          user="$(printf '%s' "$DEPLOY_USER" | tr -d '\r\n' | xargs)"
          www_path="$(printf '%s' "$DEPLOY_WWW_PATH" | tr -d '\r\n')"
          port="$(printf '%s' "$DEPLOY_PORT" | tr -d '\r\n' | xargs)"

          host="${host#http://}"
          host="${host#https://}"
          host="${host%/}"

          test -n "$host"
          test -n "$user"
          test -n "$www_path"

          case "$host" in
            *[[:space:]]*|*/*|*@*)
              echo "Invalid DEPLOY_HOST: $host"
              exit 1
              ;;
          esac

          case "$user" in
            *[[:space:]]*|*@*|*/*)
              echo "Invalid DEPLOY_USER: $user"
              exit 1
              ;;
          esac

          case "$port" in
            ''|*[!0-9]*)
              echo "Invalid DEPLOY_PORT: $port"
              exit 1
              ;;
          esac

          if [ "${www_path#/}" = "$www_path" ]; then
            echo "DEPLOY_WWW_PATH must be absolute: $www_path"
            exit 1
          fi

          {
            echo "DEPLOY_HOST=$host"
            echo "DEPLOY_USER=$user"
            echo "DEPLOY_WWW_PATH=$www_path"
            echo "DEPLOY_PORT=$port"
          } >> "$GITHUB_ENV"

      - name: Setup SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Setup known_hosts
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy nginx config
        run: |
          ssh_opts="-p $DEPLOY_PORT -o ControlMaster=auto -o ControlPersist=600 -o ControlPath=$HOME/.ssh/cm-%C"
          scp_opts="-P $DEPLOY_PORT -o ControlMaster=auto -o ControlPersist=600 -o ControlPath=$HOME/.ssh/cm-%C"

          scp $scp_opts ops/nginx/deploy-nginx-service.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/deploy-nginx-service.sh"
          scp $scp_opts ops/nginx/deploy-nginx-site.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/deploy-nginx-site.sh"
          scp $scp_opts ops/nginx/nginx-service-restart.conf "$DEPLOY_USER@$DEPLOY_HOST:/tmp/nginx-service-restart.conf.new"
          scp $scp_opts ops/nginx/kpshelkovo-online.conf "$DEPLOY_USER@$DEPLOY_HOST:/tmp/kpshelkovo-online.conf.new"
          scp $scp_opts ops/nginx/media-kpshelkovo-online.conf "$DEPLOY_USER@$DEPLOY_HOST:/tmp/media-kpshelkovo-online.conf.new"
          scp $scp_opts ops/nginx/sravni-shelkovo.conf "$DEPLOY_USER@$DEPLOY_HOST:/tmp/sravni-shelkovo.conf.new"

          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" '
            set -eu

            trap "rm -f /tmp/deploy-nginx-service.sh /tmp/deploy-nginx-site.sh /tmp/nginx-service-restart.conf.new /tmp/kpshelkovo-online.conf.new /tmp/media-kpshelkovo-online.conf.new /tmp/sravni-shelkovo.conf.new" EXIT

            sudo -n install -m 755 /tmp/deploy-nginx-service.sh /usr/local/sbin/deploy-nginx-service
            sudo -n install -m 755 /tmp/deploy-nginx-site.sh /usr/local/sbin/deploy-nginx-site
            sudo -n /usr/local/sbin/deploy-nginx-service /tmp/nginx-service-restart.conf.new
            sudo -n /usr/local/sbin/deploy-nginx-site /tmp/kpshelkovo-online.conf.new kpshelkovo-online
            sudo -n /usr/local/sbin/deploy-nginx-site /tmp/media-kpshelkovo-online.conf.new media-kpshelkovo-online
            sudo -n /usr/local/sbin/deploy-nginx-site /tmp/sravni-shelkovo.conf.new sravni-shelkovo
          '

      - name: Sync build to server
        run: |
          ssh_opts="-p $DEPLOY_PORT -o ControlMaster=auto -o ControlPersist=600 -o ControlPath=$HOME/.ssh/cm-%C"

          # --no-t: не обновлять mtime у файлов, контент которых не изменился
          # (-c сравнивает по checksum, без -t mtime на сервере остается прежним
          # для уже существующих файлов; новые файлы получат mtime деплоя)
          rsync_opts="-azc --no-t --delete --mkpath --chmod=D755,F644"
          pagefind_manifest=$(mktemp)
          static_manifest=$(mktemp)
          indexnow_deploy_manifest=$(mktemp)
          indexnow_manifest="$RUNNER_TEMP/indexnow-rsync-changes.txt"
          pagefind_retention_minutes=$((7 * 24 * 60))
          static_retention_minutes=$((30 * 24 * 60))
          static_current_manifest_path='.cache/kpshelkovo/static-current-files.manifest'
          static_pending_manifest_path="$static_current_manifest_path.pending"
          rsync_filters=(
            --filter='protect /search/pagefind.*.pf_meta'
            --filter='protect /search/index/*.pf_index'
            --filter='protect /search/filter/*.pf_filter'
            --filter='protect /search/fragment/*.pf_fragment'
            --filter='protect /static/***'
          )
          trap 'rm -f "$pagefind_manifest" "$static_manifest" "$indexnow_deploy_manifest"' EXIT

          find dist/www/search -type f \
            \( -name 'pagefind.*.pf_meta' -o -name '*.pf_index' -o -name '*.pf_filter' -o -name '*.pf_fragment' \) \
            -printf '%P\0' > "$pagefind_manifest"
          test -s "$pagefind_manifest"

          find dist/www/static -type f -printf '%P\0' > "$static_manifest"
          test -s "$static_manifest"

          # IndexNow submits only canonical HTML files added by this deployment.
          rsync $rsync_opts --dry-run --itemize-changes --out-format='%i|%n' \
            "${rsync_filters[@]}" \
            -e "ssh $ssh_opts" \
            dist/www/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_WWW_PATH/" \
            > "$indexnow_deploy_manifest"

          # Keep unacknowledged changes outside the web root so a retry can submit them.
          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            mkdir -p '.cache/kpshelkovo'
            cat >> '$INDEXNOW_PENDING_PATH'
          " < "$indexnow_deploy_manifest"
          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" \
            "cat '$INDEXNOW_PENDING_PATH'" > "$indexnow_manifest"

          # Give files leaving the active generation a fresh retention window.
          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            if [ -d '$DEPLOY_WWW_PATH/static' ]; then
              cd '$DEPLOY_WWW_PATH/static'
              if [ -f \"\$HOME/$static_current_manifest_path\" ]; then
                xargs -0r touch -c -- < \"\$HOME/$static_current_manifest_path\"
                if [ -f \"\$HOME/$static_pending_manifest_path\" ]; then
                  xargs -0r touch -c -- < \"\$HOME/$static_pending_manifest_path\"
                fi
              else
                # Without an authoritative manifest, favor availability.
                find . -type f -exec touch -- {} +
              fi
            fi
          "

          # Persist the intended generation before rsync so an interrupted deploy is recoverable.
          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            mkdir -p '.cache/kpshelkovo'
            cat > '$static_pending_manifest_path'
          " < "$static_manifest"

          # Active clients may still request files from earlier search and static generations.
          rsync $rsync_opts \
            "${rsync_filters[@]}" \
            -e "ssh $ssh_opts" \
            dist/www/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_WWW_PATH/"

          # Keep current chunks and prune generations outside the client activity window.
          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$DEPLOY_WWW_PATH/search'
            xargs -0 touch --
            find . -type f \\
              \\( -name 'pagefind.*.pf_meta' -o -name '*.pf_index' -o -name '*.pf_filter' -o -name '*.pf_fragment' \\) \\
              -mmin +$pagefind_retention_minutes -delete
          " < "$pagefind_manifest"

          # Retain complete superseded static generations for the browser cache window.
          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$DEPLOY_WWW_PATH/static'
            xargs -0r touch -c -- < \"\$HOME/$static_pending_manifest_path\"
            find . -type f -mmin +$static_retention_minutes -delete
            mv \"\$HOME/$static_pending_manifest_path\" \"\$HOME/$static_current_manifest_path\"
          "

          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" "test -d '$DEPLOY_MEDIA_PATH' && test -w '$DEPLOY_MEDIA_PATH'"
          rsync $rsync_opts \
            -e "ssh $ssh_opts" \
            dist/media/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_MEDIA_PATH/"

      - name: Smoke Pagefind production delivery
        run: sh scripts/smoke-pagefind-delivery.sh https://kpshelkovo.online dist/www

      - name: Submit new URLs to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          ssh_opts="-p $DEPLOY_PORT -o ControlMaster=auto -o ControlPersist=600 -o ControlPath=$HOME/.ssh/cm-%C"

          node scripts/indexnow.ts submit apps/www/dist/indexnow-urls.json "$RUNNER_TEMP/indexnow-rsync-changes.txt"
          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" "rm -f '$INDEXNOW_PENDING_PATH'"

      - name: Publish deployed URLs
        run: |
          {
            echo '## Production URLs'
            echo
            echo '- https://kpshelkovo.online'
            echo '- https://media.kpshelkovo.online'
            echo '- https://сравни.шелково.рф'
          } >> "$GITHUB_STEP_SUMMARY"
