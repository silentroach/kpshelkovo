name: Lighthouse

on:
  schedule:
    - cron: '17 4 * * 2'
  workflow_dispatch:
    inputs:
      target:
        description: Lighthouse target
        required: true
        default: production
        type: choice
        options:
          - production
          - static

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIGHTHOUSE_SITE_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'static' }}
      LIGHTHOUSE_DISABLE_ANALYTICS: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && 'false' || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        if: ${{ env.LIGHTHOUSE_SITE_TARGET == 'static' }}
        env:
          PUBLIC_YANDEX_MAPS_API_KEY: ${{ secrets.YANDEX_MAPS_API_KEY }}
        run: pnpm build

      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun

      - name: Check robots policy and publish Lighthouse summary
        if: ${{ always() }}
        run: node scripts/lighthouse-summary.mjs

      - name: Upload Lighthouse reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
