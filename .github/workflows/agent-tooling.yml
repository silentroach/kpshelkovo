name: Agent tooling

on:
  push:
    branches: [master]
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - '.agents/**'
      - '.opencode/**'
      - 'openspec/**'
      - 'scripts/openspec.mjs'
      - 'scripts/skills.mjs'
      - 'scripts/agent-tooling.test.mjs'
      - 'package.json'
      - 'skills-lock.json'
      - 'pnpm-*.yaml'
      - '*fmt*'
      - '.prettierignore'
      - '.gitignore'
      - 'docs/development.md'
      - '.github/workflows/agent-tooling.yml'
      - '.github/dependabot.yml'
  pull_request:
    branches: [master]
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - '.agents/**'
      - '.opencode/**'
      - 'openspec/**'
      - 'scripts/openspec.mjs'
      - 'scripts/skills.mjs'
      - 'scripts/agent-tooling.test.mjs'
      - 'package.json'
      - 'skills-lock.json'
      - 'pnpm-*.yaml'
      - '*fmt*'
      - '.prettierignore'
      - '.gitignore'
      - 'docs/development.md'
      - '.github/workflows/agent-tooling.yml'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm openspec:validate
      - run: pnpm test:agent-tooling
      - run: pnpm skills:install
      - run: pnpm skills:check
      - run: git diff --exit-code
