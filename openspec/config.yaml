schema: spec-driven

context: |
  kpshelkovo.online — статический информационный сайт для жителей КП Шелково.
  Факты опираются на источники; человеческие и машиночитаемые представления согласованы.
  Стек — Astro workspace с pnpm, apps/www и shared packages.
  Перед работой прочитай раздел «Жизненный цикл изменений» корневого AGENTS.md
  и применимые локальные AGENTS.md.
  Артефакты пиши по-русски, сохраняя обязательные заголовки и маркеры OpenSpec.
  Все терминальные вызовы OpenSpec, включая примеры upstream, исполняй как
  pnpm exec openspec из корня workspace. Не используй Markdown-таблицы.
  Термины — GLOSSARY.md; долговечные решения — docs/decisions/;
  продукт — PRODUCT.md; дизайн — docs/design/design-code-shelkovo.md.
  Профильные документы читай по затронутой области.

rules:
  proposal:
    - Укажи связанный issue и границы самостоятельного изменения.
    - Если нужна production-приёмка, укажи в Impact её критерии и влияние на закрытие issue и архивирование change.
    - >-
      Перед выбором решения выясни проблему, нужный результат и границы задачи.
      Используй уже полученные ответы; спрашивай только о том, от чего зависят
      объём или поведение.
  design:
    - Сошлись на применимых действующих ADR; технический подход конкретного изменения оставь здесь.
    - >-
      При важном техническом выборе сравни подходящие варианты, включая то,
      что уже есть в проекте. Объясни, почему выбран этот вариант и на какие
      компромиссы идём. Не добавляй альтернативы ради количества.
  specs:
    - Перед созданием или правкой delta specs и перед их переносом в основные specs прочитай раздел «Отбор требований для specs» корневого AGENTS.md и примени критерии отбора к каждому требованию и сценарию.
    - >-
      Перед завершением specs сверь их с решениями, согласованными в обсуждении.
      Сохрани важные ограничения и различия в поведении. Условия, нужные только
      для выполнения этой задачи, запиши в design или tasks по правилам отбора
      требований.
  tasks:
    - >-
      Включи три части приёмки из AGENTS.md: структурную валидацию OpenSpec,
      проверку требований и сценариев подходящими средствами, ревью всего актуального diff.
    - Запланируй вызов reviewer для ревью актуального diff перед PR, разбор замечаний и повтор после исправлений; при недоступности reviewer запланируй явную самопроверку обоими проходами.
    - Чекбоксы охватывают реализацию, документацию и приёмку до архивирования; sync/archive и публикация PR выполняются далее по проектному workflow.
    - >-
      По возможности группируй работу по проверяемому результату: в одну группу
      входят все нужные для него технические слои. Учитывай зависимости между
      группами. Выделяй подготовку, документацию и общую приёмку в отдельные
      задачи, когда это нужно.
    - >-
      Проверь, что задачи охватывают согласованный объём: для каждого важного
      требования есть работа и способ проверки. Каждая задача должна следовать
      из требований, дизайна или правил проекта.

operations:
  apply:
    guidance:
      - Восстанови разрешение реализации и состояние ветки по проектной политике.
      - Доводи собственный diff до качества внутри текущего change, сохраняя согласованный объём.
      - >-
        Перед PR вызови reviewer из основной сессии. Передай задачу и решения из issue,
        согласованный change, применимые specs, целевую ветку и точный SHA базы,
        рабочую директорию, результаты проверок и ограничения. Разбери все замечания:
        исправь подтверждённые, обоснуй отклонённые, спор об изменении согласованного
        поведения верни владельцу. После правок повторно проверь изменившиеся места
        и связанные сценарии, включая изменения от sync/archive.
      - >-
        Если reviewer не обнаружен или не может завершить вызов, самостоятельно
        проведи основной проход и отдельно ponytail-review по всему актуальному diff.
        Укажи причину fallback, фактический охват и отсутствие независимого ревью
        в итогах приёмки и PR; не выдавай fallback за runtime-проверку reviewer.
      - >-
        Прежде чем отметить задачу выполненной, проверь результат указанным
        в ней способом. Сборка и проверка типов сами по себе не доказывают,
        что нужное поведение работает.
      - >-
        Не отключай и не ослабляй проверки ради успешного прогона. Если проверка
        расходится с согласованными требованиями, выясни причину. Изменение
        требований согласуй с владельцем.
  archive:
    guidance:
      - Сверь три части приёмки и условие production-проверки в проектной политике до архивирования.
      - После синхронизации основных specs и архивирования выполни pnpm openspec:validate.
      - >-
        После sync/archive перед PR повторно вызови reviewer для итогового diff,
        включая основные specs и архив change. Передай прежние замечания, исправления
        и результаты проверок; разбери новые находки и повтори проверку после правок.
        Если reviewer недоступен, выполни оба прохода самостоятельно и явно укажи
        причину fallback и отсутствие независимого ревью в PR.
