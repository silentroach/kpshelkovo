schema: spec-driven

context: |
  - Обсуждения и артефакты пиши по-русски, сохраняя служебный синтаксис OpenSpec.
  - Береги время читателя: сокращай текст, а не содержание.
  - Предпочитай конкретные факты и значения расплывчатым оценкам.
  - Пиши абзацами и списками. Таблицы используй, только если без них
    информацию гораздо сложнее понять.
  - Общайся с читателем как с коллегой, а не как с клиентом.
    Не объясняй основы, не разжёвывай каждый шаг и не пересказывай то,
    что видно из кода. Называй компромисс вместо перечисления всех вариантов.
    Если решение кажется ошибочным, возражай и объясняй почему.
    Лучше поспорить, чем молча согласиться.
  - Фиксируй в артефактах существенные решения, ограничения и выводы
    исследования, чтобы агент в новой сессии мог реализовать изменение
    без истории этого чата.
    После объёмного планирования рекомендуй новую сессию для реализации.
  - Подробности требований и решений храни в одном месте; в остальных
    артефактах используй краткое резюме и ссылку.
  - Фиксируй согласованные термины предметной области в GLOSSARY.md в корне
    репозитория и используй их единообразно.
  - В Markdown используй относительные ссылки внутри одного изменения;
    на остальные файлы репозитория ссылайся от корня (`/...`).
  - Основные спецификации описывают реализованное в репозитории поведение.
    Планируемое поведение описывай в изменениях.
  - В tasks.md сохраняй сведения о реализации, которых не видно в diff:
    результаты и ограничения значимых проверок, измерения, отклонения от плана,
    отложенные вопросы и ссылки на принятые решения.

rules:
  specs:
    - 'Из основных спецификаций не ссылайся на файлы активных изменений.'

operations:
  apply:
    guidance:
      - 'В коде комментируй только неочевидные места и причины решений.'
      - >-
        Прежние несвязанные сбои подтверждай данными и отмечай отдельно.
        Непройденные или пропущенные обязательные проверки изменения
        блокируют завершение.
