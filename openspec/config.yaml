schema: spec-driven

context: |
  Публичный сайт kpshelkovo.online: Astro workspace с pnpm, apps/www и shared packages.
  Действующая политика — раздел «Жизненный цикл изменений» корневого AGENTS.md.
  Артефакты пишутся по-русски с обязательными маркерами OpenSpec на английском.
  Все терминальные вызовы OpenSpec, включая примеры upstream, исполняются как
  pnpm exec openspec из корня workspace. Ответы и документы оформляются списками.
  Общие термины — GLOSSARY.md, долговечные решения — docs/decisions/,
  продуктовые правила — PRODUCT.md и DESIGN.md; локальные правила приложений — их AGENTS.md.

rules:
  proposal:
    - Укажи связанный issue и границы самостоятельного изменения.
  design:
    - Сошлись на действующие ADR; технический подход конкретного изменения оставь здесь.
    - До реализации зафиксируй обязательную production-приёмку, если она нужна.
  specs:
    - Перед созданием или правкой delta specs и перед их переносом в основные specs прочитай openspec/AGENTS.md и примени критерии отбора к каждому требованию и сценарию.
  tasks:
    - Каждая задача должна содержать способ проверки результата.

operations:
  apply:
    guidance:
      - Восстанови разрешение реализации и состояние ветки по проектной политике.
      - Доводи собственный diff до качества внутри текущего change, сохраняя согласованный объём.
  archive:
    guidance:
      - Сверь три части приёмки и условие production-проверки в проектной политике до архивирования.
