schema: spec-driven

context: |
  kpshelkovo.online — статический сайт для жителей КП Шелково; Astro workspace с pnpm.
  Факты опираются на источники; человеческие и машиночитаемые представления согласованы.
  - Следуй [жизненному циклу изменений](/AGENTS.md#жизненный-цикл-изменений) и применимым локальным AGENTS.md.
  - Объём работы и проверок выбирай по [правилам соразмерности](/docs/development.md#объём-работы-и-проверок).
  - По затронутой области читай [продукт](/PRODUCT.md), [ADR](/docs/decisions/) и [дизайн-гайд](/docs/design/design-code-shelkovo.md).
  - Обсуждения и артефакты пиши по-русски, сохраняя служебный синтаксис OpenSpec; используй абзацы и списки.
  - Береги время читателя: сокращай текст, сохраняя требования, ограничения и сценарии. Предпочитай конкретные факты и значения оценкам.
  - Общайся как с коллегой. Не пересказывай код и общеизвестные основы; обосновывай существенный выбор, компромиссы и возражения.
  - До выбора решения уточни проблему, результат и границы; спрашивай только о влияющем на объём или поведение.
  - В артефактах сохраняй существенные решения, ограничения и выводы исследования, чтобы реализация не зависела от истории чата.
    После объёмного планирования рекомендуй новую сессию для реализации.
  - Подробности храни в документе-владельце; в остальных давай краткое резюме и ссылку.
  - Согласованные термины предметной области фиксируй в [глоссарии](/GLOSSARY.md) и используй единообразно.
  - В заметках к задачам в tasks.md сохраняй сведения о выполнении, которых не видно в diff:
    результаты и ограничения значимых проверок, измерения, отклонения от плана, отложенные вопросы и ссылки на решения.

rules:
  proposal:
    - Укажи связанный issue и границы самостоятельного изменения.
    - Если нужна production-приёмка, укажи в Impact её критерии и влияние на закрытие issue и архивирование change.
  design:
    - Сошлись на применимых ADR; среди реальных альтернатив учитывай существующее решение.
    - В неприменимых обязательных разделах достаточно короткой отметки.
  specs:
    - Применяй [отбор требований](/AGENTS.md#отбор-требований-для-specs) при подготовке, правке и sync specs.
    - Сверь specs с согласованными решениями, сохрани ограничения и различия поведения.
    - Основные specs описывают реализованное в рабочей ветке поведение; планируемое описывай в changes.
    - Из основных specs не ссылайся на файлы активных changes.
  tasks:
    - >-
      Покрой согласованный объём работой и проверками, включая [приёмку](/AGENTS.md#проверки-и-завершение)
      и [цикл reviewer](/docs/development.md#ревью-изменения-в-opencode).
    - Sync/archive и PR оставляй вне чекбоксов tasks.md.

operations:
  apply:
    guidance:
      - В коде комментируй только неочевидные места и причины решений.
