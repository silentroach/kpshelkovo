schema: spec-driven

context: |
  kpshelkovo.online — статический информационный сайт для жителей КП Шелково.
  Факты опираются на источники; человеческие и машиночитаемые представления согласованы.
  Стек — Astro workspace с pnpm, apps/www и shared packages.
  Перед работой прочитай [жизненный цикл изменений](/AGENTS.md#жизненный-цикл-изменений)
  и применимые локальные AGENTS.md.
  Артефакты пиши по-русски, со штатными заголовками и маркерами OpenSpec, списками вместо таблиц.
  Все терминальные вызовы OpenSpec, включая примеры upstream, — через pnpm exec openspec из корня workspace.
  По затронутой области читай [глоссарий](/GLOSSARY.md), [ADR](/docs/decisions/),
  [продукт](/PRODUCT.md) и [дизайн-гайд](/docs/design/design-code-shelkovo.md).
  Объём артефактов и проверок выбирай по [правилам соразмерности](/docs/development.md#объём-работы-и-проверок).
  Перед реализацией незапланированной сложности следуй [правилу advisor](/AGENTS.md#согласование-и-передача)
  и [протоколу консультации](/docs/development.md#консультация-с-advisor).

  При написании артефактов:
  - Сокращай слова, сохраняя требования, ограничения и сценарии. Объём — повод для редактуры, не лимит; границы change определяй по самостоятельным возможностям.
  - Называй поведение, факты и результаты вместо оценок и вводных фраз.
  - Подробности храни в документе-владельце; в остальных давай суть и точную ссылку. Общие правила и протоколы подключай ссылкой.

rules:
  proposal:
    - Укажи связанный issue и границы самостоятельного изменения.
    - Если нужна production-приёмка, укажи в Impact её критерии и влияние на закрытие issue и архивирование change.
    - >-
      Перед выбором решения уточни проблему, результат и границы задачи.
      Учитывай полученные ответы; спрашивай лишь о влияющем на объём или поведение.
  design:
    - >-
      Сошлись на применимых ADR. Кратко опиши технический подход и существенные решения:
      выбор, реальные альтернативы (включая существующее решение), причина и компромисс.
    - Для каждого реального риска назови последствие и меру. В неприменимых обязательных разделах достаточно короткой отметки.
  specs:
    - >-
      Перед подготовкой, правкой и sync specs прочитай [отбор требований](/AGENTS.md#отбор-требований-для-specs)
      и примени его к каждому требованию и сценарию.
    - Сверь specs с согласованными решениями, сохрани ограничения и различия поведения.
  tasks:
    - >-
      Запланируй три части [приёмки](/AGENTS.md#проверки-и-завершение)
      и [цикл reviewer](/docs/development.md#ревью-изменения-в-opencode), включая самопроверку при недоступности агента.
    - Чекбоксы — реализация, документация и приёмка до архивирования; sync/archive и PR — последующие шаги workflow.
    - >-
      Задача — короткое описание результата со всеми нужными слоями и проверкой в чекбоксе;
      обоснование — ссылка на требования, design или правила проекта.
      Отдельная проверка нужна для интеграции нескольких результатов.
    - >-
      Соблюдай зависимости и проверь покрытие согласованного объёма:
      для каждого важного требования есть работа и проверка.

operations:
  apply:
    guidance:
      - Восстанови разрешение реализации и состояние ветки по [порядку согласования](/AGENTS.md#согласование-и-передача).
      - Доводи собственный diff до качества внутри текущего change, сохраняя согласованный объём.
      - >-
        Перед PR вызови reviewer для полного прохода по [протоколу](/docs/development.md#ревью-изменения-в-opencode).
        Исправь подтверждённые замечания, обоснуй отклонённые, спор о поведении верни владельцу.
        После исправлений получи адресный повтор.
      - >-
        При недоступности reviewer проведи основной проход и ponytail-review по всему diff; в итогах приёмки и PR
        укажи причину, охват и отсутствие независимого ревью.
      - >-
        Закрывай задачу по актуальному результату её проверки. Один результат может закрывать несколько задач;
        повторяй проверку при изменении входов или обоснованных сомнениях.
        Сборка и typecheck не заменяют проверку поведения.
      - >-
        Не отключай и не ослабляй проверки ради успешного прогона. Расхождения с требованиями разбери,
        изменение требований согласуй с владельцем.
      - В заметках к выполненной задаче оставляй измерения, отклонения и ограничения, которые не видны из diff.
  archive:
    guidance:
      - До архивирования сверь [приёмку и условия production-проверки](/AGENTS.md#проверки-и-завершение).
      - После синхронизации основных specs и архивирования выполни pnpm openspec:validate.
      - >-
        После sync/archive перед PR проведи адресный повтор reviewer по [протоколу](/docs/development.md#ревью-изменения-в-opencode),
        разбери замечания и проверь исправления. При недоступности агента проведи основной проход и ponytail-review,
        указав в PR причину, охват и отсутствие независимого ревью.
