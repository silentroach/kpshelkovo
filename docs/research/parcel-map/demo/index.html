<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Участки Шелково — проверка контуров</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.5 system-ui,
          sans-serif;
        color: #203726;
      }
      main {
        height: 100svh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 12px 20px;
        border-bottom: 1px solid #d9e1d8;
        background: #fff;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      p {
        margin: 4px 0;
      }
      select,
      input,
      button {
        font: inherit;
        padding: 6px;
        max-width: 100%;
      }
      #offset {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 16px;
        margin: 8px 0 0;
        padding: 0;
        border: 0;
      }
      #offset legend {
        padding: 0;
      }
      #offset input {
        width: 6em;
      }
      #selection {
        min-height: 1.5em;
      }
      #map {
        flex: 1;
        min-height: 0;
      }
      .parcel-label {
        display: none;
        transform: translate(-50%, -50%);
        padding: 2px 4px;
        border: 0;
        background: #ffffffe6;
        color: #203726;
        font:
          11px/1.3 system-ui,
          sans-serif;
        white-space: nowrap;
        cursor: pointer;
      }
      .show-labels .parcel-label {
        display: block;
      }
      :focus-visible {
        outline: 3px solid #915d16;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Участки Шелково</h1>
        <p id="summary"></p>
        <label for="part">Перейти к части:</label>
        <select id="part" disabled>
          <option value="">Все участки</option>
        </select>
        <fieldset id="offset" disabled>
          <legend>Смещение слоя, м. Минус — влево или вниз.</legend>
          <label>Вправо <input id="east" type="number" step="0.1" required /></label>
          <label>Вверх <input id="north" type="number" step="0.1" required /></label>
          <button id="reset-offset" type="button">Без смещения</button>
        </fieldset>
        <p>
          Контуры НСПД с сопоставленными номерами застройщика. Приблизьте карту, чтобы увидеть
          номера.
        </p>
        <p id="selection" role="status">
          Нажмите на участок, чтобы увидеть кадастровый номер и площадь.
        </p>
      </header>
      <div id="map" role="region" aria-label="Карта сопоставленных участков"></div>
      <noscript>Для карты нужен JavaScript.</noscript>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
